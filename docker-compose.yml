version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ceam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ceam_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ceam_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ceam_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
      SPRING_FLYWAY_ENABLED: "false"
      # Variável para configurar o CORS dinamicamente
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1,http://127.0.0.1:3000,http://127.0.0.1:80"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ceam_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata: