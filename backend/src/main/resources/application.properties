spring.application.name=ceam-backend

# Configurações do PostgreSQL (apontando para o contentor Docker)
spring.datasource.url=jdbc:postgresql://db:5432/ceam_db
spring.datasource.username=admin
spring.datasource.password=admin_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicialização de Dados (Seed via data.sql)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.flyway.enabled=false

# Configuração da Porta do Servidor
server.port=8080
